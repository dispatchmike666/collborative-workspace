<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Shared workspace</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-name">workspace</span>
    </a>
    <div id="crew" class="crew-row" aria-label="The crew"></div>
    <span class="spacer"></span>
    <button id="open-palette" class="btn small" type="button" aria-keyshortcuts="Control+K">
      <span class="label-long">Jump to…</span> <kbd>Ctrl K</kbd>
    </button>
    <button id="toggle-sound" class="btn small icon ghost" type="button" aria-pressed="false" aria-label="Sounds are off">♪</button>
    <button id="open-settings" class="btn small icon ghost" type="button" aria-label="Look and feel" title="Look and feel">◐</button>
    <span id="who" class="who"></span>
    <button id="logout" class="btn small ghost" type="button">Log out</button>
  </header>
  <main id="view"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
