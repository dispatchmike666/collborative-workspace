<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Glasshouse</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar menubar">
    <a class="brand" href="#/" aria-label="Home">
      <span class="brand-mark" id="brand-mark"></span>
    </a>
    <nav id="menus" class="menus" aria-label="Menus"></nav>
    <span id="top-location" class="top-location">Home</span>
    <span class="spacer"></span>
    <div id="crew" class="crew-row" aria-label="The crew"></div>
    <button id="open-palette" class="mb-btn" type="button" aria-keyshortcuts="Control+K" aria-label="Jump to…" title="Jump to… (Ctrl K)"></button>
    <button id="toggle-sound" class="mb-btn" type="button" aria-pressed="false" aria-label="Sounds are off">♪</button>
    <button id="open-settings" class="mb-btn" type="button" aria-label="Look and feel" title="Look and feel">◐</button>
    <span id="who" class="who"></span>
    <button id="logout" class="mb-btn" type="button" hidden>Log out</button>
    <span id="clock" class="clock" aria-hidden="true"></span>
  </header>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation"></aside>
    <main id="view"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
